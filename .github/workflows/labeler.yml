# PR が触った path から tool の label を付ける。release notes は label で tool ごとに絞る (各 tool の .github/release.yml)。
# 外部 action は使わず、runner に入っている gh だけで付ける。
# pull_request_target は PR の code を checkout しない。fork の PR でも label を付けるために使う。
# path は gh の出力を比較に使うだけで、shell には渡さない。
name: labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Add tool labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh pr diff "$PR_NUMBER" --name-only)
          for tool in bash-gates secret-scan herdr-timeline; do
            if grep -q "^$tool/" <<<"$files"; then
              gh pr edit "$PR_NUMBER" --add-label "$tool"
            fi
          done
