# PR が触った path から tool の label を付ける。release notes は label で tool ごとに絞る (各 tool の .github/release.yml)。
# 外部 action は使わず、runner に入っている gh だけで付ける。
# この repo は fork の PR を受け付けないので pull_request で足りる (同じ repo の PR なら書き込み権限の token が使える)。PR の code は checkout しない。
# path は gh の出力を比較に使うだけで、shell には渡さない。label が付く前に release PR が merge されると、その PR は notes に載らない (限界)。conflict を抱えて開いた PR は、base 側の変更だけで解消すると label が付かない (限界)。
name: labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

# 同じ PR の run は直列にする (古い run が新しい run の外した label を付け直さないように)
concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Add tool labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # files API は path を quote せず返し、rename の元 path (previous_filename) も持つ。diff 全文を取らないので巨大な PR でも失敗しない
          # 1 record を JSON の 1 行にして、改行を含む path でも行が割れないようにする
          files=$(gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/files" --jq '.[] | [.filename, .previous_filename] | @json')
          # files API は 3,000 件で打ち切る。欠けた一覧で label を外さないよう、件数が合わなければ何も変えずに失敗する
          total=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq .changed_files)
          got=$(wc -l <<<"$files")
          if [ "$got" -lt "$total" ]; then
            echo "files API returned $got of $total files; leaving labels as they are" >&2
            exit 1
          fi
          for tool in bash-gates secret-scan herdr-timeline; do
            # 触らなくなった tool の label は外す (変更を戻した PR が notes に残らないようにする)
            if grep -Eq "^\[\"$tool/|,\"$tool/" <<<"$files"; then
              gh pr edit "$PR_NUMBER" --add-label "$tool"
            else
              gh pr edit "$PR_NUMBER" --remove-label "$tool"
            fi
          done
