# inbox-core の release の自動化。仕組みと前提は tagpr.yml と同じ (設定は inbox-core/.tagpr)。
# bash-gates の merge で inbox-core の release PR が更新されないよう、inbox-core/ の変更だけで走らせる。
# docs と markdown だけの変更では走らせない (理由は tagpr.yml と同じ)。
# paths は後ろに書いたものが前の一致を外す。tagpr が release PR で更新する CHANGELOG.md だけは除外から戻す。
# 初回の release PR が Cargo.toml を変えないと、merge の push が markdown だけの変更になり tag が作られないため。
name: tagpr-inbox-core

on:
  push:
    branches: ["main"]
    paths:
      - 'inbox-core/**'
      - '!**/docs/**'
      - '!**/*.md'
      - 'inbox-core/CHANGELOG.md'

permissions:
  contents: read

jobs:
  inbox-core:
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/tagpr
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          config: inbox-core/.tagpr
