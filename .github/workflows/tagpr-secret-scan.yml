# secret-scan の release の自動化。仕組みと前提は tagpr.yml と同じ (設定は secret-scan/.tagpr)。
# bash-gates の merge で secret-scan の release PR が更新されないよう、secret-scan/ の変更だけで走らせる。
name: tagpr-secret-scan

on:
  push:
    branches: ["main"]
    paths:
      - 'secret-scan/**'
      - '!**/docs/**'
      - '!**/*.md'

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      # app-id は非推奨 (deprecationMessage: "Use 'client-id' instead.") なので client-id を使う
      - uses: actions/create-github-app-token@v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: read
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: Songmu/tagpr@v1.22.0
        with:
          config: secret-scan/.tagpr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
