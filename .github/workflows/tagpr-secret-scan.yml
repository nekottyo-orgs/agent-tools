# secret-scan の release の自動化。仕組みと前提は tagpr.yml と同じ (設定は secret-scan/.tagpr)。
# bash-gates の merge で secret-scan の release PR が更新されないよう、secret-scan/ の変更だけで走らせる。
# docs と markdown だけの変更では走らせない (理由は tagpr.yml と同じ)。
name: tagpr-secret-scan

on:
  push:
    branches: ["main"]
    paths:
      - 'secret-scan/**'
      - '!**/docs/**'
      - '!**/*.md'

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/tagpr
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          config: secret-scan/.tagpr
