# release の自動化 (https://github.com/Songmu/tagpr)。tool ごとに workflow と設定を分け、bash-gates は bash-gates/.tagpr で動かす (secret-scan は tagpr-secret-scan.yml)。
# 前提: GitHub App を repo に install し、App の Client ID を repository variable の APP_CLIENT_ID、
#       private key を repository secret の APP_PRIVATE_KEY に置く。
#       App の権限は Contents / Pull requests を Read and write、Issues を Read-only 以上にする。
# release PR と tag を App の token で作るのは、GITHUB_TOKEN の操作では後続の workflow が動かないため。
# action は supply chain 対策で .github/workflows/actions.lock に固定する (gh actions-lock で更新)。
# uses は tag 表記で書く。lockfile が commit と repo の identity (owner_id / repo_id) を固定するので SHA の直書きは要らない。
# 更新と検証: gh actions-lock / gh actions-lock --verify-local
# tagpr は release PR を作る単位で、その tool の変更かどうかを path では見ない (前回の tag 以降に merge した PR を全部数える)。
# push の trigger を tool のディレクトリに絞らないと、別の tool の merge のたびにこの tool の release PR が更新される。
# 絞っても release PR 自体は tool のディレクトリ (version file と CHANGELOG) を変えるので、merge 後の tag の作成は走る。
# docs と markdown だけの変更では release PR を開かない。release PR の merge は version file (Cargo.toml) も変えるので、除外しても tag の作成は走る。
# paths の否定 (!) は後ろに書いたものが前の一致を外す。push の変更が除外だけに当たるときは走らない。
name: tagpr

on:
  push:
    branches: ["main"]
    paths:
      - 'bash-gates/**'
      - '!**/docs/**'
      - '!**/*.md'

# tagpr 本体は App の token (env の GITHUB_TOKEN) で動く。この permissions が効くのは checkout が使う既定の token だけ。
permissions:
  contents: read

jobs:
  bash-gates:
    runs-on: ubuntu-latest
    steps:
      # app-id は非推奨 (deprecationMessage: "Use 'client-id' instead.") なので client-id を使う
      - uses: actions/create-github-app-token@v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: read
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: Songmu/tagpr@v1.22.0
        with:
          config: bash-gates/.tagpr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
