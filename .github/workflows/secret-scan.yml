# secret-scan/ の build と回帰テスト。tool ごとに workflow を分け、path filter で他の tool の変更では走らせない。
# workspace の root の Cargo.toml (release profile) と Cargo.lock は全 tool に効くので、変更されたら走らせる。
# toolchain の version (Rust 1.98) は手元の検証と同じ値に固定する。
# action は .github/workflows/actions.lock に固定する (gh actions-lock で更新)。uses を tag 表記で書くのは、lockfile が commit と repo の identity を固定するため。
name: secret-scan

on:
  push:
    paths:
      - 'secret-scan/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/secret-scan.yml'
      - '.github/workflows/actions.lock'
  pull_request:
    paths:
      - 'secret-scan/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/secret-scan.yml'
      - '.github/workflows/actions.lock'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install 1.98 --profile minimal && rustup default 1.98

      # 検出ルールごとの「止める / 止めない」の table 駆動 test と、引数・policy・stdin の異常系 (exit 2) を含む
      - name: Test
        run: cargo test --release --locked -p secret-scan
