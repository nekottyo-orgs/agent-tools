# secret-scan/ の build と回帰テスト。tool ごとに workflow を分ける。
# CI の入口は ci-gate.yml に一本化した。PR では ci-gate が変更 path を見て secret-scan に当たるときだけ、
# main への push では ci-gate が全 tool を対象にして、この workflow を workflow_call で呼ぶ。
# (二重実行しないよう、pull_request と push の trigger は持たない)
# workspace の root の Cargo.toml (release profile) と Cargo.lock は全 tool に効くので、ci-gate の path 判定で全 tool の変更として扱う。
# toolchain の version (Rust 1.98) は手元の検証と同じ値に固定する。
# action は .github/workflows/actions.lock に固定する (gh actions-lock で更新)。uses を tag 表記で書くのは、lockfile が commit と repo の identity を固定するため。
name: secret-scan

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install 1.98 --profile minimal && rustup default 1.98

      # 検出ルールごとの「止める / 止めない」の table 駆動 test と、引数・policy・stdin の異常系 (exit 2) を含む
      - name: Test
        run: cargo test --release --locked -p secret-scan
