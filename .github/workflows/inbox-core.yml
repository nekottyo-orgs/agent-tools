# inbox-core/ の lint・回帰テストと、現在の lib.rs の Lean への翻訳・証明。tool ごとに workflow を分け、path filter で他の tool の変更では走らせない。
# workspace の root の Cargo.toml (release profile) と Cargo.lock は全 tool に効くので、変更されたら走らせる。
# toolchain の version (Rust 1.98) は bash-gates.yml と同じ値に固定する。
# action は .github/workflows/actions.lock に固定する (gh actions-lock で更新)。
# cargo fmt --check は回さない。src/lib.rs は sha256 を固定した証明の対象で、rustfmt の整形に合わせて書き換えられないため。
name: inbox-core

on:
  push:
    paths:
      - 'inbox-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/inbox-core.yml'
      - '.github/workflows/actions.lock'
  pull_request:
    paths:
      - 'inbox-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/inbox-core.yml'
      - '.github/workflows/actions.lock'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install 1.98 --profile minimal --component clippy && rustup default 1.98

      - name: Lint
        run: cargo clippy --locked -p inbox-core --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked -p inbox-core

      - name: Install formal verification toolchain
        env:
          AENEAS_SPIKE: ${{ runner.temp }}/inbox-core-lean
        run: bash inbox-core/lean/setup-ci.sh

      - name: Regenerate Lean and check proofs
        env:
          AENEAS_SPIKE: ${{ runner.temp }}/inbox-core-lean
        run: bash inbox-core/lean/regen.sh
