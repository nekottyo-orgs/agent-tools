# inbox-core/ の lint・回帰テストと、現在の lib.rs の Lean への翻訳・証明。tool ごとに workflow を分け、path filter で他の tool の変更では走らせない。
# workspace の root の Cargo.toml (release profile) と Cargo.lock は全 tool に効くので、変更されたら走らせる。
# toolchain の version (Rust 1.98) は bash-gates.yml と同じ値に固定する。
# action は .github/workflows/actions.lock に固定する (gh actions-lock で更新)。
# cargo fmt --check は回さない。src/lib.rs は sha256 を固定した証明の対象で、rustfmt の整形に合わせて書き換えられないため。
name: inbox-core

on:
  push:
    paths:
      - 'inbox-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/inbox-core.yml'
      - '.github/workflows/actions.lock'
  pull_request:
    paths:
      - 'inbox-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/inbox-core.yml'
      - '.github/workflows/actions.lock'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Restore Lean dependencies
        id: lean-deps
        uses: actions/cache/restore@v6.1.0
        with:
          # 形式検証を通過した default branch の依存だけを使う。
          path: ${{ runner.temp }}/inbox-core-lean/lean-inbox/.lake/packages
          key: inbox-core-lean-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('inbox-core/lean/lean-toolchain', 'inbox-core/lean/setup-ci.sh', 'inbox-core/lean/regen.sh') }}

      - name: Discard a non-exact dependency cache
        if: steps.lean-deps.outputs.cache-hit != 'true'
        run: rm -rf -- "$RUNNER_TEMP/inbox-core-lean/lean-inbox/.lake/packages"

      - name: Install toolchains
        run: |
          AENEAS_SPIKE="$RUNNER_TEMP/inbox-core-lean" bash inbox-core/lean/setup-ci.sh &
          formal_setup=$!
          stable_rc=0
          rustup toolchain install 1.98 --profile minimal --component clippy || stable_rc=$?
          wait "$formal_setup"
          exit "$stable_rc"

      - name: Lint
        run: cargo +1.98 clippy --locked -p inbox-core --all-targets -- -D warnings

      - name: Test
        run: cargo +1.98 test --locked -p inbox-core

      - name: Regenerate Lean and check proofs
        env:
          AENEAS_SPIKE: ${{ runner.temp }}/inbox-core-lean
        run: bash inbox-core/lean/regen.sh

      - name: Save verified Lean dependencies
        if: >-
          success() && steps.lean-deps.outputs.cache-hit != 'true' &&
          github.event_name == 'push' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ runner.temp }}/inbox-core-lean/lean-inbox/.lake/packages
          key: ${{ steps.lean-deps.outputs.cache-primary-key }}
