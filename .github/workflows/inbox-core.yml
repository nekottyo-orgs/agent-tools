# inbox-core/ の lint・回帰テストと、現在の lib.rs の Lean への翻訳・証明。tool ごとに workflow を分ける。
# CI の入口は ci-gate.yml に一本化した。PR では ci-gate が変更 path を見て inbox-core に当たるときだけ、
# main への push では ci-gate が全 tool を対象にして、この workflow を workflow_call で呼ぶ。
# (二重実行しないよう、pull_request と push の trigger は持たない)
# workspace の root の Cargo.toml (release profile) と Cargo.lock は全 tool に効くので、ci-gate の path 判定で全 tool の変更として扱う。
# toolchain の version (Rust 1.98) は bash-gates.yml と同じ値に固定する。
# action は .github/workflows/actions.lock に固定する (gh actions-lock で更新)。
# cargo fmt --check は回さない。src/lib.rs は sha256 を固定した証明の対象で、rustfmt の整形に合わせて書き換えられないため。
name: inbox-core

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install formal verification toolchain
        env:
          AENEAS_SPIKE: ${{ runner.temp }}/inbox-core-lean
        run: bash inbox-core/lean/setup-ci.sh

      - name: Regenerate Lean and check proofs
        env:
          AENEAS_SPIKE: ${{ runner.temp }}/inbox-core-lean
        run: bash inbox-core/lean/regen.sh

  rust-x86:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install 1.98 --profile minimal --component clippy

      - name: Lint
        run: cargo +1.98 clippy --locked -p inbox-core --all-targets -- -D warnings

      - name: Test
        run: cargo +1.98 test --locked -p inbox-core
