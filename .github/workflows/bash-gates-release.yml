# bash-gates の binary と sha256 を、tagpr が draft で作った Release (tag は bash-gates/vX.Y.Z) に載せてから公開する。
# repo は immutable releases が有効で、公開した Release には asset を足せない。asset が全部揃ってから公開する順序にする。
# draft の Release を起点にできる release event は無い (created などは draft では発火しない)。起点は tag の push にする。
# tagpr は GitHub App の token で tag を push するので、後続の workflow が起動する。
# tagpr は tag を push してから draft を作る。upload の job は draft が見えるまで待つ。
# 失敗したときは未公開の draft と tag が残る。asset の無い Release は公開されない。run の再実行で直る。
# PR ではこのファイルを変えたときだけ build を回し、upload と公開は tag の push のときだけ走る。
# 取る側は <asset>.sha256 を同じ dir に置いて `shasum -a 256 -c <asset>.sha256` で検証する。
name: bash-gates-release

on:
  push:
    tags:
      - 'bash-gates/v*'
  pull_request:
    paths:
      - '.github/workflows/bash-gates-release.yml'

permissions: {}

jobs:
  build:
    strategy:
      matrix:
        include:
          # 古い glibc の image で build すると、新しい image でも動く
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      # tag の push では tag の commit、PR では PR の merge commit を build する
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install 1.98 --profile minimal && rustup default 1.98

      # runner の arch が変わったときに、別の target の binary を asset 名だけ違えて配らないための確認
      - name: Check host triple
        env:
          TARGET: ${{ matrix.target }}
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$TARGET"

      - name: Build
        run: cargo build --release --locked -p bash-gates

      - name: Stage asset
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir dist
          cp target/release/bash-gates "dist/bash-gates-$TARGET"
          cd dist
          shasum -a 256 "bash-gates-$TARGET" > "bash-gates-$TARGET.sha256"
          shasum -a 256 -c "bash-gates-$TARGET.sha256"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: bash-gates-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # contents: write はこの job だけに付ける。checkout せず、build の成果物だけを扱う
  upload:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # tag を消して作り直すと、同じ draft に 2 つの run が届く。一方の --clobber の途中で他方が公開すると、asset 不足のまま確定する。draft の確認から公開までを tag ごとに直列にする
    concurrency:
      group: bash-gates-release-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true

      # build の job から受け取った後でも sha256 が合うことを確かめる。asset は 2 target 分の 4 ファイルのはず
      - name: Verify checksums
        working-directory: dist
        run: |
          files=(*)
          test "${#files[@]}" -eq 4
          for f in *.sha256; do shasum -a 256 -c "$f"; done

      # tagpr が draft を作るのは tag の push より後。build の間に作られるはずだが、遅れても待つ (最大 5 分)
      # 公開済みの Release には触らない。immutable なので asset を足せず、足りないまま黙って確定させないため
      - name: Wait for the draft release
        run: |
          state=
          for _ in $(seq 1 30); do
            state=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>"$RUNNER_TEMP/gh-err") || true
            if [ -n "$state" ]; then break; fi
            sleep 10
          done
          # 認証・権限・rate limit の失敗も「まだ無い」と同じ空の state になるので、最後の stderr を残して切り分けられるようにする
          test "$state" = true || { cat "$RUNNER_TEMP/gh-err" >&2; echo "release $TAG is not a draft (isDraft: ${state:-not found})" >&2; exit 1; }

      # draft は公開前で asset を差し替えられるので --clobber を付ける。途中で失敗した run の再実行で、残った asset を置き換える
      # 4 ファイルは 1 回の run の build から出たもので、公開までに混ざらない
      - name: Upload assets
        run: gh release upload "$TAG" dist/* --clobber

      - name: Check assets
        run: test "$(gh release view "$TAG" --json assets --jq '.assets | length')" -eq 4

      # upload と確認が全部済んでから公開する。ここで初めて immutable になる
      - name: Publish
        run: gh release edit "$TAG" --draft=false
