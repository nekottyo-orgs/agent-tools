# bash-gates/ の build と回帰テスト。tool ごとに workflow を分け、path filter で他の tool の変更では走らせない。
# toolchain の version (Rust 1.98 / Lean v4.35.0 / elan v4.2.4) は手元の検証と同じ値に固定する。
name: bash-gates

on:
  push:
    paths:
      - 'bash-gates/**'
      - '.github/workflows/bash-gates.yml'
  pull_request:
    paths:
      - 'bash-gates/**'
      - '.github/workflows/bash-gates.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust
        run: rustup toolchain install 1.98 --profile minimal && rustup default 1.98

      # Lean は証明と vectors.txt の作り直しを検査する。テスト script は lean が PATH に無いとその検査だけ skip する
      - name: Install Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh \
            | sh -s -- -y --no-modify-path --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # テスト script は --offline でビルドするので、依存は先に取っておく
      - name: Build
        run: |
          cargo fetch --locked --manifest-path bash-gates/Cargo.toml
          cargo build --release --locked --manifest-path bash-gates/Cargo.toml

      - name: Test
        run: bash bash-gates/tests/bash-gates.test.sh
