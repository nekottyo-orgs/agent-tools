# bash-gates/ の build と回帰テスト。tool ごとに workflow を分け、push では path filter で他の tool の変更では走らせない。
# PR の入口は ci-gate.yml に一本化した。PR では ci-gate が変更 path を見て、bash-gates に当たるときだけこの workflow を workflow_call で呼ぶ。
# (PR で二重実行しないよう、pull_request の trigger は持たない)
# workspace の root の Cargo.toml (release profile) と Cargo.lock は全 tool に効くので、変更されたら走らせる。
# toolchain の version (Rust 1.98 / Lean v4.35.0 / elan v4.2.4) は手元の検証と同じ値に固定する。elan は release asset の sha256 でも固定する。
# action は .github/workflows/actions.lock に固定する (gh actions-lock で更新)。uses を tag 表記で書くのは、lockfile が commit と repo の identity を固定するため。
name: bash-gates

on:
  push:
    paths:
      - 'bash-gates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/bash-gates.yml'
      - '.github/workflows/actions.lock'
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install 1.98 --profile minimal && rustup default 1.98

      # Lean は証明と vectors.txt の作り直しを検査する。テスト script は lean が PATH に無いとその検査だけ skip する
      # elan-init.sh は binary を releases/latest から取り version を固定できないので使わず、
      # v4.2.4 の release asset を sha256 で検証してから展開する (ubuntu-latest は x86_64)。
      # sha256 は release API の asset の digest と、手元で download して計算した値が一致したもの
      - name: Install Lean
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o elan.tar.gz https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  elan.tar.gz" | sha256sum -c -
          tar xzf elan.tar.gz
          ./elan-init -y --no-modify-path --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # テスト script は --offline でビルドするので、依存は先に取っておく
      - name: Build
        run: |
          cargo fetch --locked
          cargo build --release --locked -p bash-gates

      - name: Test
        run: bash bash-gates/tests/bash-gates.test.sh
