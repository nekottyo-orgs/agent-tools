[package]
name = "bash-gates"
version = "0.1.2"
edition = "2021"
publish = false
license = "MIT"

[dependencies]
fancy-regex = "0.20.2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Bash を打つたびに起動するので起動時間を最優先にする
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
